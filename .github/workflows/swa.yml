name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'rg-guid-api' }}
  AZURE_STATIC_WEB_APP_NAME: ${{ vars.AZURE_STATIC_WEB_APP_NAME || 'guid-api-swa' }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}
  CUSTOM_DOMAIN_NAME: ${{ vars.CUSTOM_DOMAIN_NAME || 'guid.codes' }}
  ENABLE_CUSTOM_DOMAIN: ${{ vars.ENABLE_CUSTOM_DOMAIN || 'true' }}

jobs:
  infrastructure:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Deploy Infrastructure
    outputs:
      static-web-app-token: ${{ steps.deploy-infrastructure.outputs.deployment-token }}
      static-web-app-url: ${{ steps.deploy-infrastructure.outputs.static-web-app-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_DEV }}

      - name: Deploy Bicep Infrastructure
        id: deploy-infrastructure
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          scope: subscription
          region: ${{ env.AZURE_LOCATION }}
          template: ./deployment/staticwebapp.bicep
          parameters: >
            resourceGroupName=${{ env.AZURE_RESOURCE_GROUP }}
            staticWebAppName=${{ env.AZURE_STATIC_WEB_APP_NAME }}
            location=${{ env.AZURE_LOCATION }}
            repositoryUrl=${{ github.server_url }}/${{ github.repository }}
            repositoryToken=${{ secrets.GITHUB_TOKEN }}
            branch=${{ github.ref_name }}
            sku=Standard
            customDomainName=${{ env.CUSTOM_DOMAIN_NAME }}
            enableCustomDomain=${{ env.ENABLE_CUSTOM_DOMAIN }}
            tags='{"Environment":"${{ github.ref_name == 'main' && 'Production' || 'Development' }}","Repository":"${{ github.repository }}","Branch":"${{ github.ref_name }}"}'

      - name: Get Static Web App Deployment Token
        id: get-swa-token
        run: |
          # Get the deployment token from the Static Web App
          SWA_TOKEN=$(az staticwebapp secrets list \
            --name ${{ env.AZURE_STATIC_WEB_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.apiKey" \
            --output tsv)
          
          echo "deployment-token=$SWA_TOKEN" >> $GITHUB_OUTPUT
          
          # Get the default hostname
          SWA_URL=$(az staticwebapp show \
            --name ${{ env.AZURE_STATIC_WEB_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "defaultHostname" \
            --output tsv)
          
          echo "static-web-app-url=https://$SWA_URL" >> $GITHUB_OUTPUT

  build_and_deploy:
    needs: infrastructure
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Application
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'package.json'

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ needs.infrastructure.outputs.static-web-app-token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          ###### Repository/Build Configurations ######
          app_location: "/src"
          api_location: "/api"
          output_location: "/dist"
          ###### End of Repository/Build Configurations ######

      - name: Deployment Summary
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "🌐 Application URL: ${{ needs.infrastructure.outputs.static-web-app-url }}"
          echo "🌍 Custom Domain: https://${{ env.CUSTOM_DOMAIN_NAME }}"
          echo "📋 Static Web App: ${{ env.AZURE_STATIC_WEB_APP_NAME }}"
          echo "📁 Resource Group: ${{ env.AZURE_RESOURCE_GROUP }}"
          echo ""
          echo "🔧 DNS Configuration Required:"
          echo "Create a CNAME record: ${{ env.CUSTOM_DOMAIN_NAME }} -> [Check Azure portal for target]"
          echo "💡 Note: SSL certificate will be automatically provisioned after DNS validation"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ needs.infrastructure.outputs.static-web-app-token }}
          action: "close"